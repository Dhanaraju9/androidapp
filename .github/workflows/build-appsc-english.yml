name: Build APPSC Group-2 English APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Generate debug keystore
        run: |
          keytool -genkeypair \
            -keystore debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Build APK
        run: |
          gradle assembleDebug \
            -x processDebugGoogleServices \
            -PappId=andhra-pradesh-appsc-group-2-en \
            -PtenantId=APP001 \
            -PappPackage=com.independent.examapps.andhrapradesh.appscgroup2.en \
            --stacktrace --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: APPSC-Group-2-English-APK
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 7
