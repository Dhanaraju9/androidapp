<!DOCTYPE html>
<html lang="te"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Practice &amp; Appearance</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Telugu:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f6f4;--card:#fff;--tx:#14201a;--mut:#5b6b62;--bd:#dce4df;--ac:#16a34a;--acs:#e5f6ea;--bad:#dc2626;--bads:#fdeaea;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1511;--card:#17211b;--tx:#eaf2ed;--mut:#9db0a5;--bd:#293730;--acs:#12351f;--bads:#3a1717}}
:root[data-theme="dark"]{--bg:#0e1511;--card:#17211b;--tx:#eaf2ed;--mut:#9db0a5;--bd:#293730;--acs:#12351f;--bads:#3a1717}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.55 "Noto Sans Telugu",system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:440px;margin:0 auto;padding:16px}
h1{font-size:20px;margin:4px 0 2px}
.sub{color:var(--mut);font-size:14px;margin:0 0 14px}
.bar{display:flex;align-items:center;gap:8px;margin-bottom:14px}
#now{flex:1;font-weight:700;font-size:18px;color:var(--ac)}
button{font:inherit;color:inherit}
.btn{border:0;border-radius:999px;padding:9px 16px;background:var(--ac);color:#fff;font-weight:600;cursor:pointer}
.btn.s{background:var(--card);color:var(--tx);border:2px solid var(--bd)}
.screen{background:var(--card);border:1px solid var(--bd);border-radius:22px;padding:18px}
.meta{font-size:13px;color:var(--mut);margin-bottom:6px}
.q{font-size:19px;font-weight:700;margin:0 0 14px}
.o{display:flex;align-items:center;gap:12px;width:100%;padding:13px;margin:0 0 10px;border:2px solid var(--bd);border-radius:14px;background:var(--card);text-align:left;cursor:pointer;transition:background .2s,border-color .2s}
.o b{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--bg);font-size:14px;flex:none}
.o span{flex:1}
.o em{font-style:normal;font-weight:700;color:var(--ac);opacity:0;transform:scale(0)}
.o.ok{border-color:var(--ac);background:var(--acs);animation:pop .5s}
.o.ok b{background:var(--ac);color:#fff}
.o.ok em{opacity:1;transform:scale(1);transition:.3s .15s}
.o.bad{border-color:var(--bad);background:var(--bads);animation:shk .4s}
.exp{max-height:0;overflow:hidden;opacity:0;transition:max-height .4s,opacity .4s}
.exp.show{max-height:220px;opacity:1}
.exp div{border-left:4px solid var(--ac);background:var(--acs);border-radius:10px;padding:10px 12px;font-size:15px}
.exp strong{display:block;color:var(--ac);font-size:14px}
.chips{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:16px}
.chips button{display:flex;align-items:center;gap:8px;padding:10px;border:2px solid var(--bd);border-radius:12px;background:var(--card);cursor:pointer;text-align:left;font-size:14px}
.chips i{font-style:normal;font-weight:700;width:24px;height:24px;border-radius:50%;background:var(--bg);display:grid;place-items:center;font-size:13px;flex:none}
.chips .on{border-color:var(--ac);background:var(--acs)}
.chips .on i{background:var(--ac);color:#fff}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:50}
#fl{position:fixed;inset:0;background:rgba(34,197,94,.4);opacity:0;pointer-events:none;z-index:40}
#fl.go{animation:fl .5s}
#bc{position:fixed;left:50%;top:50%;width:140px;height:140px;margin:-70px 0 0 -70px;opacity:0;pointer-events:none;z-index:60}
#bc.go{animation:bcp 1.7s both}
#bc path{stroke-dasharray:1;stroke-dashoffset:1}
#bc.go path{animation:dr .4s .25s both}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.06)}100%{transform:scale(1)}}
@keyframes shk{20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
@keyframes fl{from{opacity:1}to{opacity:0}}
@keyframes bcp{0%{opacity:0;transform:scale(.2)}20%{opacity:1;transform:scale(1.2)}30%{transform:scale(1)}80%{opacity:1}100%{opacity:0;transform:scale(1)}}
@keyframes dr{to{stroke-dashoffset:0}}

.seg{display:flex;background:var(--card);border:1px solid var(--bd);border-radius:999px;padding:4px;margin-bottom:14px}
.seg button{flex:1;border:0;background:none;padding:8px;border-radius:999px;font-weight:600;cursor:pointer;color:var(--mut)}
.seg .on{background:var(--ac);color:#fff}
.tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px;padding-bottom:2px}
.tabs button{flex:none;border:2px solid var(--bd);background:var(--card);border-radius:999px;padding:6px 14px;font-size:14px;cursor:pointer}
.tabs .on{border-color:var(--ac);background:var(--acs)}
.row{display:flex;align-items:center;gap:10px;width:100%;padding:12px;margin-bottom:8px;border:2px solid var(--bd);border-radius:12px;background:var(--card);text-align:left;cursor:pointer}
.row .rd{width:20px;height:20px;border-radius:50%;border:2px solid var(--bd);flex:none}
.row.on{border-color:var(--ac);background:var(--acs)}
.row.on .rd{border-color:var(--ac);background:radial-gradient(var(--ac) 45%,transparent 50%)}
.tag{font-size:12px;background:var(--ac);color:#fff;border-radius:999px;padding:1px 8px}
.note{font-size:13px;color:var(--mut)}
.hide{display:none}
</style></head><body>
<main>
<h1>Practice &amp; Appearance</h1>
<div class="seg"><button id="v1" class="on">Practice</button><button id="v2">Settings</button></div>
<section id="pv">
<div class="tabs" id="tabs"></div>
<div class="screen"><div class="meta" id="meta"></div><p class="q" id="q"></p><div id="opts"></div>
<div class="exp" id="exp"><div><strong>వివరణ</strong><span id="expt"></span></div></div></div>
<div class="bar" style="margin:12px 0 0"><span class="note" id="cn" style="flex:1"></span><button class="btn s" id="rp">↻ మళ్ళీ</button></div>
</section>
<section id="sv" class="hide">
<p class="note">Correct answer effect. ఒకటి నొక్కి preview చూడండి, తర్వాత Apply నొక్కండి.</p>
<div id="list"></div>
<div class="bar"><button class="btn" id="apply">Apply</button><button class="btn s" id="def">Default కి మార్చు</button></div>
<p class="note" id="msg"></p>
</section>
</main>
<canvas id="fx"></canvas><div id="fl"></div>
<div id="bc"><svg viewBox="0 0 100 100" width="140" height="140"><circle cx="50" cy="50" r="46" fill="#16a34a"/><path d="M28 52l16 16 30-34" pathLength="1" fill="none" stroke="#fff" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
<script>
const $=s=>document.querySelector(s),R=(a,b)=>a+Math.random()*(b-a),pick=a=>a[Math.random()*a.length|0];
const COL=['#ff595e','#ffca3a','#8ac926','#1982c4','#6a4c93','#ff924c'];
const cv=$('#fx'),cx=cv.getContext('2d');let W,H,P=[];
function rs(){const d=devicePixelRatio||1;W=innerWidth;H=innerHeight;cv.width=W*d;cv.height=H*d;cx.setTransform(d,0,0,d,0,0)}
addEventListener('resize',rs);rs();
function add(o){P.push(Object.assign({g:0,drag:.98,vr:0,size:6,life:60,age:0,delay:0,color:'#22c55e',rot:0,vx:0,vy:0,wob:0,ph:Math.random()*6.3},o))}
const polar=(n,a,b,f)=>{for(let i=0;i<n;i++){const t=6.283*i/n+R(-.1,.1),s=R(a,b);f(Math.cos(t)*s,Math.sin(t)*s)}};
const retrig=e=>{e.classList.remove('go');void e.offsetWidth;e.classList.add('go')};
const FX=[
['Confetti Pop',(x,y)=>{for(let i=0;i<70;i++){const a=R(-3,-.14),s=R(5,13);add({t:'rect',x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,g:.28,drag:.985,size:R(6,11),color:pick(COL),vr:R(-.3,.3),life:R(80,120)})}}],
['Star Burst',(x,y)=>polar(18,4,9,(vx,vy)=>add({t:'star',x,y,vx,vy,drag:.95,size:R(8,16),color:pick(['#ffd60a','#ffc300','#ff9f1c']),vr:.1,life:55}))],
['Ripple Rings',(x,y)=>{for(let i=0;i<4;i++)add({t:'ring',x,y,size:10,sp:3.4,life:60,delay:i*9,color:i%2?'#86efac':'#16a34a'})}],
['Fireworks',(x,y)=>[0,1,2].forEach(n=>setTimeout(()=>{const bx=x+R(-110,110),by=y-R(90,200),c=pick(COL),c2=pick(COL);polar(34,3,8,(vx,vy)=>add({t:'spark',x:bx,y:by,vx,vy,g:.09,drag:.95,color:Math.random()<.35?c2:c,life:R(50,75)}))},n*320))],
['Emoji Burst',(x,y)=>polar(14,5,11,(vx,vy)=>add({t:'emoji',e:pick(['🎉','✨','⭐','👏','🎊','💯']),x,y,vx,vy,g:.2,drag:.95,size:R(24,34),vr:R(-.1,.1),life:80}))],
['Sparkle Shine',(x,y,r)=>{for(let i=0;i<22;i++)add({t:'sparkle',x:x+R(-r.width/2,r.width/2),y:y+R(-r.height,r.height),size:R(10,22),rot:R(0,1),vr:.03,life:50,delay:R(0,30),color:pick(['#ffc800','#22c55e','#ff9f1c','#4ea8ff'])})}],
['Hearts Rise',(x,y)=>{for(let i=0;i<16;i++)add({t:'emoji',e:pick(['💚','💖','💛','💙','🧡']),x:x+R(-90,90),y:y+R(-10,20),vy:-R(2.5,5),drag:1,size:R(20,32),wob:R(.4,1),life:R(80,110),delay:R(0,25)})}],
['Coin Shower',(x,y)=>{for(let i=0;i<26;i++)add({t:'coin',x:x+R(-30,30),y,vx:R(-5,5),vy:-R(9,15),g:.42,drag:.99,size:R(9,13),life:R(85,110)})}],
['Big Check Pop',()=>{retrig($('#bc'));for(let i=0;i<3;i++)add({t:'ring',x:W/2,y:H/2,size:60,sp:3.5,life:55,delay:i*10})}],
['Shatter Flash',(x,y,r)=>{retrig($('#fl'));for(let i=0;i<46;i++){const a=R(0,6.283),s=R(3,11);add({t:'shard',x:x+R(-r.width/2,r.width/2),y:y+R(-r.height/2,r.height/2),vx:Math.cos(a)*s,vy:Math.sin(a)*s-2,g:.3,drag:.97,size:R(6,13),color:pick(['#16a34a','#22c55e','#86efac','#facc15']),vr:R(-.4,.4),life:R(60,85)})}}]
];
function star(r,n,ir){cx.beginPath();for(let i=0;i<n*2;i++){const a=i*Math.PI/n-Math.PI/2,d=i%2?r*ir:r;cx.lineTo(Math.cos(a)*d,Math.sin(a)*d)}cx.closePath()}
function draw(p,al){cx.save();cx.globalAlpha=al;cx.translate(p.x,p.y);
switch(p.t){
case'rect':cx.rotate(p.rot);cx.scale(1,Math.cos(p.age*.25+p.ph));cx.fillStyle=p.color;cx.fillRect(-p.size/2,-p.size/3,p.size,p.size*.66);break;
case'star':cx.rotate(p.rot);cx.fillStyle=p.color;star(p.size,5,.45);cx.fill();break;
case'spark':cx.strokeStyle=p.color;cx.lineWidth=2.2;cx.lineCap='round';cx.beginPath();cx.moveTo(0,0);cx.lineTo(-p.vx*3,-p.vy*3);cx.stroke();break;
case'ring':cx.strokeStyle=p.color;cx.lineWidth=1+4*(1-p.age/p.life);cx.beginPath();cx.arc(0,0,p.size+p.age*p.sp,0,7);cx.stroke();break;
case'emoji':cx.rotate(p.rot);cx.font=p.size+'px serif';cx.textAlign='center';cx.textBaseline='middle';cx.fillText(p.e,0,0);break;
case'sparkle':cx.rotate(p.rot);cx.fillStyle=p.color;star(p.size*Math.sin(p.age/p.life*Math.PI),4,.2);cx.fill();break;
case'coin':cx.scale(Math.abs(Math.cos(p.age*.18+p.ph)),1);cx.fillStyle='#f5b301';cx.beginPath();cx.arc(0,0,p.size,0,7);cx.fill();cx.strokeStyle='#b07d00';cx.lineWidth=2;cx.stroke();cx.fillStyle='#ffd95a';cx.beginPath();cx.arc(0,0,p.size*.6,0,7);cx.fill();break;
case'shard':cx.rotate(p.rot);cx.fillStyle=p.color;cx.beginPath();cx.moveTo(0,-p.size);cx.lineTo(p.size*.7,p.size*.6);cx.lineTo(-p.size*.7,p.size*.6);cx.fill();break}
cx.restore()}
let last=0;
function loop(t){const d=Math.min(2,(t-(last||t))/16.7||1);last=t;cx.clearRect(0,0,W,H);
for(let i=P.length-1;i>=0;i--){const p=P[i];if(p.delay>0){p.delay-=d;continue}
p.age+=d;if(p.age>=p.life){P.splice(i,1);continue}
p.vx*=p.drag;p.vy=p.vy*p.drag+p.g*d;p.x+=p.vx*d+(p.wob?Math.sin(p.age*.12+p.ph)*p.wob:0);p.y+=p.vy*d;p.rot+=p.vr*d;
const k=p.age/p.life;draw(p,k<.65?1:(1-k)/.35)}
requestAnimationFrame(loop)}
requestAnimationFrame(loop);

const S=[
{n:'Sets Practice',t:'Sets',q:'భారతదేశ రాజధాని ఏది?',o:['ముంబై','న్యూఢిల్లీ','కోల్‌కతా','చెన్నై'],a:1,e:'న్యూఢిల్లీ భారతదేశ రాజధాని. 1911లో కోల్‌కతా నుండి ఢిల్లీకి రాజధాని మార్పు ప్రకటించారు.'},
{n:'Subtopics Practice',t:'Subtopics',q:'భారత రాజ్యాంగం ఎప్పుడు అమలులోకి వచ్చింది?',o:['1947','1950','1952','1935'],a:1,e:'భారత రాజ్యాంగం 1950 జనవరి 26న అమలులోకి వచ్చింది.'},
{n:'Current Affairs Practice',t:'Current Affairs',q:'ISRO ప్రధాన కార్యాలయం ఏ నగరంలో ఉంది?',o:['హైదరాబాద్','బెంగళూరు','చెన్నై','తిరువనంతపురం'],a:1,e:'ISRO ప్రధాన కార్యాలయం బెంగళూరులో ఉంది.'},
{n:'Offline Downloaded Practice',t:'Offline',q:'తెలంగాణ రాష్ట్ర రాజధాని ఏది?',o:['విజయవాడ','హైదరాబాద్','వరంగల్','కరీంనగర్'],a:1,e:'హైదరాబాద్ తెలంగాణ రాష్ట్ర రాజధాని.'}];
const IDS=['confetti','star','ripple','fireworks','emoji','sparkle','hearts','coins','check','shatter'],KEY='answer_burst_effect',DEF=0;
let saved=DEF,pending=DEF,sc=0,locked=false;
try{const i=IDS.indexOf(localStorage.getItem(KEY));if(i>=0)saved=pending=i}catch(e){}
const oe=$('#opts'),tabs=$('#tabs'),list=$('#list');
S.forEach((s,i)=>{const b=document.createElement('button');b.textContent=s.t;b.onclick=()=>load(i);tabs.appendChild(b)});
function load(i){sc=i;locked=false;P.length=0;$('#bc').classList.remove('go');$('#fl').classList.remove('go');const s=S[i];
[...tabs.children].forEach((b,j)=>b.classList.toggle('on',j===i));
$('#meta').textContent=s.n+' · ప్రశ్న 1 / 10';$('#q').textContent=s.q;$('#expt').textContent=s.e;$('#exp').classList.remove('show');
oe.innerHTML='';s.o.forEach((t,k)=>{const b=document.createElement('button');b.className='o';b.innerHTML='<b>'+'ABCD'[k]+'</b><span>'+t+'</span><em>✓</em>';b.onclick=()=>choose(k);oe.appendChild(b)});
$('#cn').textContent='Effect: '+FX[saved][0]+(saved===DEF?' (default)':'')}
function choose(k){if(locked)return;const b=oe.children[k];
if(k!==S[sc].a){b.classList.remove('bad');void b.offsetWidth;b.classList.add('bad');return}
locked=true;b.classList.add('ok');$('#exp').classList.add('show');
const r=b.getBoundingClientRect();FX[saved][1](r.left+r.width/2,r.top+r.height/2,r)}
FX.forEach((f,i)=>{const b=document.createElement('button');b.className='row';b.innerHTML='<span class="rd"></span><span style="flex:1">'+(i+1)+'. '+f[0]+'</span>'+(i===DEF?'<span class="tag">Default</span>':'');
b.onclick=()=>{pending=i;mark();$('#msg').textContent='';const r=b.getBoundingClientRect();P.length=0;FX[i][1](r.left+r.width/2,r.top+r.height/2,r)};list.appendChild(b)});
function mark(){[...list.children].forEach((b,i)=>b.classList.toggle('on',i===pending))}
function apply(){saved=pending;try{localStorage.setItem(KEY,IDS[saved])}catch(e){}
$('#msg').textContent='✓ Applied: '+FX[saved][0]+'. Sets, Subtopics, Current Affairs, Offline practice అన్నింటిలో ఇదే వస్తుంది.'}
function view(n){$('#pv').classList.toggle('hide',n!==1);$('#sv').classList.toggle('hide',n!==2);$('#v1').classList.toggle('on',n===1);$('#v2').classList.toggle('on',n===2);P.length=0;
if(n===1)load(sc);else{pending=saved;mark();$('#msg').textContent=''}}
$('#v1').onclick=()=>view(1);$('#v2').onclick=()=>view(2);
$('#apply').onclick=apply;$('#def').onclick=()=>{pending=DEF;mark();apply()};
$('#rp').onclick=()=>load(sc);
load(0);
</script></body></html>
